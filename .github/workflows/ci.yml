name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: secretary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d secretary"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/secretary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create the roles of the local compose database
        run: |
          psql "$DATABASE_URL" -c "CREATE ROLE app_owner LOGIN CREATEDB PASSWORD 'app_owner'"
          psql "$DATABASE_URL" -c "CREATE ROLE app_runtime LOGIN PASSWORD 'app_runtime'"
      - name: Build the schema by running the migrations
        run: node dist/bootstrap/migrate.js
        env:
          MIGRATION_DATABASE_URL: postgres://ci:ci@localhost:5432/secretary
      - run: npm test
        env:
          SUPERUSER_DATABASE_URL: postgres://ci:ci@localhost:5432/secretary

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fail when a merged migration changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PULL_REQUEST_BASE_SHA" ;;
            merge_group) base="$MERGE_GROUP_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="origin/main" ;;
          esac
          npm run check:migrations -- "$base"

  mutation-shard:
    name: mutation (${{ matrix.shard }})
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: secretary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d secretary"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/secretary
      SUPERUSER_DATABASE_URL: postgres://ci:ci@localhost:5432/secretary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create the roles of the local compose database
        run: |
          psql "$DATABASE_URL" -c "CREATE ROLE app_owner LOGIN CREATEDB PASSWORD 'app_owner'"
          psql "$DATABASE_URL" -c "CREATE ROLE app_runtime LOGIN PASSWORD 'app_runtime'"
      - name: Mutate this shard's share of the gated files
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          shard_files="$(npm run --silent mutation:shard-files -- "$SHARD" "$SHARD_COUNT")"
          if [ -z "$shard_files" ]; then
            echo "no gated files in this shard; mutation skipped"
            exit 0
          fi
          npm run mutation -- --mutate "$shard_files"

  mutation:
    needs: mutation-shard
    if: always() && github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when a mutation shard did not succeed
        env:
          SHARDS_RESULT: ${{ needs.mutation-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "mutation shards finished with: $SHARDS_RESULT"
            exit 1
          fi
