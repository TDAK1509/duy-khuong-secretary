name: leak-live

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Attack case ids separated by commas, for example E01,E05, or all
        type: string
        default: all
      runs:
        description: Runs per case
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  leak-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      OWNER_DATABASE_URL: postgres://app_owner:app_owner@localhost:5432/secretary
      RUNTIME_DATABASE_URL: postgres://app_runtime:app_runtime@localhost:5432/secretary
      CHAT_PROVIDER: openai-compatible
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-6.1-sol
      ADMIN_CHAT_MODEL: gpt-6.1-sol
      ADMIN_CHAT_REASONING_EFFORT: medium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse a database that is not the job's own Postgres service
        run: |
          case "$OWNER_DATABASE_URL" in
            postgres://app_owner:app_owner@localhost:5432/secretary) ;;
            *) echo "OWNER_DATABASE_URL is not the job's own Postgres service."; exit 1 ;;
          esac
          case "$RUNTIME_DATABASE_URL" in
            postgres://app_runtime:app_runtime@localhost:5432/secretary) ;;
            *) echo "RUNTIME_DATABASE_URL is not the job's own Postgres service."; exit 1 ;;
          esac
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create the database roles
        run: psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -f docker/postgres-init/01-owner-role.sql
      - name: Migrate the database as the owner
        env:
          MIGRATION_DATABASE_URL: ${{ env.OWNER_DATABASE_URL }}
        run: node src/bootstrap/migrate.ts
      - name: Run the live leak run
        env:
          LLM_API_KEY: ${{ secrets.LEAK_LIVE_LLM_API_KEY }}
          LEAK_LIVE_CASES: ${{ inputs.cases }}
          LEAK_LIVE_RUNS: ${{ inputs.runs }}
        run: npm run test:leak-live
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leak-live-report
          path: reports/leak-live/
          if-no-files-found: warn
